# Windows is the only supported host. Every done-condition past Stage 3 needs
# a running DCS World, which ships for Windows only, and the executor this
# project depends on (../dcs-eval) is Windows-only for the same reason.
#
# Rust is configured in rust-toolchain.toml, not here. mise's rust tool sets
# RUSTUP_TOOLCHAIN, which overrides that file outright — and an override
# discards its `components` and `targets`, so clippy, rustfmt and the target
# go missing while the version still looks correct. Clearing the variable and
# enabling the idiomatic version file setting puts the file back in charge;
# mise still installs and manages the toolchain it names.
#
# So `mise use rust@<version>` is the wrong move here. Edit `channel` in
# rust-toolchain.toml instead, then run `mise install`.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
RUSTUP_TOOLCHAIN = ""
# One build directory for every checkout and worktree of this repository, off
# the tree. A worktree per task is the working style, and a target directory
# per worktree means every one rebuilds the workspace from nothing.
CARGO_TARGET_DIR = "{{ env.LOCALAPPDATA }}/dcs-api-docs/target"
# The reference interpreter, built by tools/mklua.sh. mise's lua plugin runs
# the tarball's makefile and Windows has no make, so the interpreter is built
# here rather than installed as a [tools] entry.
#
# Git's POSIX tools come second. Every task here is `sh tools/<script>`, and
# PowerShell and cmd have no sh of their own; Git for Windows ships one, with
# the curl, tar, sha256sum and cygpath the scripts use, and mise puts this on
# PATH for whichever shell ran it. Windows is the only supported host, so the
# path is spelled rather than discovered.
_.path = ["{{config_root}}/.lua/bin", "C:/Program Files/Git/usr/bin"]

[tools]
# The two language servers. Claude Code's lua-lsp and rust-analyzer-lsp
# plugins run the bare binary name, and mise's ls-shims directory is on PATH
# for exactly that, so a version pinned here is the version the editor and the
# agent both get.
#
# lua-language-server reads .luarc.json at the root, which pins the files to
# Lua 5.1 and declares the globals DCS gives the instrument.
lua-language-server = "3.19.1"
# rust-analyzer reads rust-analyzer.toml at the root. It is a standalone
# release rather than the rustup component: the component would be
# version-matched to rust-toolchain.toml, but the ls-shim resolves mise tools
# and would not find it.
rust-analyzer = "2026-08-31"

[tasks.lua-build]
description = "Build the reference Lua 5.1.5 PUC-Rio from the official tarball"
run = "sh tools/mklua.sh"

[tasks.lua-check]
description = "Prove the interpreter on PATH is Lua 5.1.5 PUC-Rio and nothing else"
run = "sh tools/check-lua.sh"

# The static half of the Lua gate. Exits non-zero on any finding at Warning
# or above. Through `mise exec` rather than bare: the task runner would
# resolve the shim, and lua-language-server.exe looks for its own main.lua
# beside the binary it was launched as.
[tasks.lua-lint]
description = "Type-check the Lua against .luarc.json"
run = "mise exec -- lua-language-server --check . --checklevel=Warning"

[tasks.build]
description = "Build every crate in the workspace"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format every crate"
run = "cargo fmt --all"

[tasks.docs]
description = "Hold docs/STATE.md to its budget, keep spec citations out of the code, test the hooks"
run = [
  "sh tools/statecheck.sh",
  "sh tools/nospecrefs.sh",
  "sh tools/hooktest.sh",
]

# What CI gates a pull request on. A run here that passes is a CI run that
# passes, so a push is the last step rather than the first test.
[tasks.check]
description = "Everything CI gates a pull request on"
depends = ["docs"]
run = [
  # The interpreter guard, and the cases proving it refuses. The test needs
  # no interpreter — it drives the guard with fake banners — so it runs
  # first, and a guard that has stopped refusing fails here rather than
  # passing quietly below.
  "sh tools/check-lua-test.sh",
  # The mutation sweep's own cases, and the gate that stops the inventory
  # being its own judge. Neither needs a toolchain.
  "sh tools/sweep-test.sh",
  "sh tools/sweep-cover.sh",
  "sh tools/check-lua.sh",
  "mise exec -- lua-language-server --check . --checklevel=Warning",
  # Every shell script parses as sh.
  "sh -c 'for f in tools/*.sh .claude/hooks/*.sh; do sh -n \"$f\" || exit 1; done'",
  # The Rust workspace, once it exists: format, lint, build, test.
  "sh tools/rustcheck.sh",
]

[tasks.progress]
description = "Where the plan stands, derived from the gates: every row, or `next` for the ready ones"
run = "sh tools/progress.sh"

[tasks.sweep]
description = "Re-run every recorded mutation and confirm each control still goes red; slow, edits the tree, not in check"
run = "sh tools/sweep.sh"
